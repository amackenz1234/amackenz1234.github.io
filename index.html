<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Electro Cycles · Ontario</title>
  <meta name="description" content="Electric bikes, scooters, and gear in Ontario. Call 905-308-5392." />
  <meta name="theme-color" content="#0c0c0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <script type="importmap">
  { "imports": {
    "react": "https://esm.sh/react@18",
    "react-dom/client": "https://esm.sh/react-dom@18/client"
  }}
  </script>
  <style>
    :root { --red:#c1121f; --ink:#0c0c0e; --panel:#16161a; --line:#2a2a30; --paper:#f4f1ea; --muted:#b7b2a8; --safe:env(safe-area-inset-bottom,12px); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--ink); color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding-bottom:76px; }
    a { color:inherit; }
    img { max-width:100%; display:block; }
    .wrap { width:min(1120px,calc(100% - 28px)); margin:0 auto; }
    header { position:sticky; top:0; z-index:20; background:rgba(12,12,14,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .nav { display:flex; align-items:center; justify-content:space-between; min-height:60px; gap:10px; }
    .brand { font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.78rem; text-decoration:none; }
    .brand span { color:#e5383b; }
    .hero { padding:40px 0 28px; background:radial-gradient(800px 280px at 90% -20%, rgba(193,18,31,.4), transparent 55%); }
    h1 { font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; max-width:12ch; }
    .lede { color:var(--muted); margin:14px 0 22px; max-width:40ch; }
    .btn { display:inline-block; background:var(--red); color:#fff; text-decoration:none; font-weight:800; border:0; border-radius:12px; padding:12px 16px; font-size:.95rem; cursor:pointer; }
    .ghost { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-decoration:none; font-weight:700; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .chip { background:#1c1c22; border:1px solid var(--line); color:var(--paper); border-radius:999px; padding:8px 12px; font-size:.85rem; cursor:pointer; }
    .chip.on { background:var(--red); border-color:var(--red); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
    .pic { aspect-ratio:4/3; background:#09090b; }
    .pic img { width:100%; height:100%; object-fit:cover; }
    .body { padding:12px 14px 16px; }
    .tag { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .price { font-weight:800; margin-top:6px; }
    .out { color:#e5383b; font-size:.8rem; }
    .section { padding:28px 0; }
    footer { border-top:1px solid var(--line); padding:24px 0 calc(20px + var(--safe)); color:var(--muted); font-size:.85rem; }
    .dock { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 12px calc(10px + var(--safe)); background:#111; border-top:1px solid var(--line); z-index:30; }
    .dock a { flex:1; text-align:center; text-decoration:none; font-weight:800; line-height:44px; border-radius:12px; }
    .dock .shop { background:var(--red); color:#fff; }
    .dock .call { background:#2a2a2a; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; overflow:auto; padding:20px 12px 90px; }
    .sheet { background:var(--panel); border:1px solid var(--line); border-radius:20px; max-width:640px; margin:20px auto; overflow:hidden; }
    .sheet img { width:100%; max-height:320px; object-fit:cover; }
    .sheet .pad { padding:16px; }
    @media (min-width:900px) { body { padding-bottom:0; } .dock { display:none; } }
  </style>
</head>
<body>
  <script src="./products.js"></script>
  <div id="root"></div>
  <script type="module">
    import React, { useEffect, useMemo, useState } from "react";
    import { createRoot } from "react-dom/client";
    function money(n) {
      return "C$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function App() {
      const [items, setItems] = useState([]);
      const [cat, setCat] = useState("All");
      const [q, setQ] = useState("");
      const [open, setOpen] = useState(null);
      useEffect(() => {
        if (window.PRODUCTS && window.PRODUCTS.length) { setItems(window.PRODUCTS); return; }
        fetch("./products.json").then(r => r.json()).then(setItems).catch(() => setItems([]));
      }, []);
      const cats = useMemo(() => ["All", ...Array.from(new Set(items.map(i => i.category)))], [items]);
      const list = items.filter(i => (cat === "All" || i.category === cat) && (i.name + i.sku).toLowerCase().includes(q.toLowerCase()));
      return (
        <>
          <header><div className="wrap nav">
            <a className="brand" href="#top">Electro <span>Cycles</span></a>
            <a className="btn" href="tel:9053085392">Call</a>
          </div></header>
          <section className="hero" id="top"><div className="wrap">
            <div className="tag">Ontario · Evoque dealer</div>
            <h1>Ride farther.</h1>
            <p className="lede">Custom shop site for Electro Cycles. E-bikes, scooters, mobility, and gear. GST/HST 729028506TZ0001.</p>
            <a className="btn" href="#shop">Shop inventory</a>
          </div></section>
          <section className="section" id="shop"><div className="wrap">
            <div className="row">
              {cats.map(c => <button key={c} className={"chip" + (c===cat?" on":"")} onClick={() => setCat(c)}>{c}</button>)}
            </div>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search" style={{width:"100%",margin:"0 0 16px",padding:"12px 14px",borderRadius:12,border:"1px solid #2a2a30",background:"#16161a",color:"#f4f1ea"}} />
            {list.length === 0 && <p className="lede">No matches.</p>}
            <div className="grid">
              {list.map(p => (
                <article className="card" key={p.sku} onClick={() => setOpen(p)}>
                  <div className="pic">{p.image ? <img src={p.image} alt={p.name} /> : null}</div>
                  <div className="body">
                    <div className="tag">{p.category}</div>
                    <h3>{p.name}</h3>
                    <div className="price">{money(p.price)}</div>
                    {p.qty <= 0 && <div className="out">Special order</div>}
                  </div>
                </article>
              ))}
            </div>
          </div></section>
          <section className="section" id="contact"><div className="wrap">
            <h2>Visit or call</h2>
            <p className="lede">905-308-5392 · info@electrocycles.ca · Ontario</p>
            <a className="ghost" href="mailto:info@electrocycles.ca">Email the shop</a>
          </div></section>
          <footer><div className="wrap">Electro Cycles · CAD · GST/HST 729028506TZ0001</div></footer>
          <div className="dock">
            <a className="shop" href="#shop">Shop</a>
            <a className="call" href="tel:9053085392">Call</a>
          </div>
          {open && (
            <div className="modal" onClick={() => setOpen(null)}>
              <div className="sheet" onClick={e => e.stopPropagation()}>
                {open.image && <img src={open.image} alt={open.name} />}
                <div className="pad">
                  <div className="tag">{open.sku}</div>
                  <h2>{open.name}</h2>
                  <div className="price" style={{margin:"8px 0 12px"}}>{money(open.price)}</div>
                  <p className="lede">{open.description}</p>
                  <div className="row">
                    <a className="btn" href={"mailto:info@electrocycles.ca?subject=" + encodeURIComponent(open.name)}>Ask about this</a>
                    <button className="ghost" onClick={() => setOpen(null)}>Close</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }
    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
  <script src="./register-sw.js"></script>
</body>
</html>
