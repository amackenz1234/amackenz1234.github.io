name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/require-cloud-xcode.sh'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/require-cloud-xcode.sh'
  workflow_dispatch:
    inputs:
      app_name:
        description: App name from Nativ Cloud Mac
        required: false
        default: ElectroCycles
      reason:
        description: Why this compile was requested
        required: false
        default: manual

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cloud Mac (macOS 27 RC + Xcode 27)
    # GitHub-hosted Apple Silicon Mac on macOS 27 RC with Xcode 27.
    # https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios/ElectroCycles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Require macOS 27 RC, Apple Silicon, and Xcode 27
        working-directory: ${{ github.workspace }}
        run: bash scripts/require-cloud-xcode.sh

      - name: Build ElectroCycles for iOS Simulator
        env:
          NATIV_APP_NAME: ${{ github.event.inputs.app_name || 'ElectroCycles' }}
          NATIV_REASON: ${{ github.event.inputs.reason || 'ci' }}
        run: |
          set -o pipefail
          echo "Cloud Mac compile: $NATIV_APP_NAME ($NATIV_REASON)"
          xcodebuild \
            -project ElectroCycles.xcodeproj \
            -scheme ElectroCycles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  ipa:
    name: Package unsigned IPA
    needs: build
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios/ElectroCycles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Require macOS 27 RC, Apple Silicon, and Xcode 27
        working-directory: ${{ github.workspace }}
        run: bash scripts/require-cloud-xcode.sh

      - name: Archive ElectroCycles for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ElectroCycles.xcodeproj \
            -scheme ElectroCycles \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ElectroCycles.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package .app into an unsigned .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ElectroCycles.xcarchive/Products/Applications/ElectroCycles.app"
          test -d "$APP"
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/"
          ( cd "$WORK" && zip -qry "$RUNNER_TEMP/ElectroCycles-unsigned.ipa" Payload )
          unzip -l "$RUNNER_TEMP/ElectroCycles-unsigned.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/ElectroCycles-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectroCycles-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
