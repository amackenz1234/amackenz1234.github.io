name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/require-cloud-xcode.sh'
      - 'scripts/run-full-macos.sh'
      - 'scripts/ipa-mode.sh'
      - 'scripts/package-ipa.sh'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'scripts/require-cloud-xcode.sh'
      - 'scripts/run-full-macos.sh'
      - 'scripts/ipa-mode.sh'
      - 'scripts/package-ipa.sh'
  workflow_dispatch:
    inputs:
      app_name:
        description: App name from appcompiler.ai Cloud Mac
        required: false
        default: Faraday
      reason:
        description: Why this compile was requested
        required: false
        default: manual
      signed:
        description: Produce a signed IPA when Apple signing secrets are present
        required: false
        type: boolean
        default: true
      export_method:
        description: IPA export method (ad-hoc, app-store, development)
        required: false
        default: ad-hoc
      mode:
        description: compile (build IPA) or vm (boot the Cloud Mac from Windows or any OS)
        required: false
        default: compile

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Run Cloud Mac VM
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'vm' }}
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run full macOS 27 RC
        run: bash scripts/run-full-macos.sh

  build:
    name: Full Cloud Mac (macOS 27 RC)
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'vm' }}
    # Full GitHub-hosted macOS 27 RC VM on Apple Silicon (xcode-27 image).
    # https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios/Faraday
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Run full macOS 27 RC
        working-directory: ${{ github.workspace }}
        run: bash scripts/run-full-macos.sh

      - name: Build Faraday for iOS Simulator
        env:
          NATIV_APP_NAME: ${{ github.event.inputs.app_name || 'Faraday' }}
          NATIV_REASON: ${{ github.event.inputs.reason || 'ci' }}
        run: |
          set -o pipefail
          echo "Cloud Mac compile: $NATIV_APP_NAME ($NATIV_REASON)"
          xcodebuild \
            -project Faraday.xcodeproj \
            -scheme Faraday \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  ipa:
    name: Package IPA
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'vm' }}
    needs: build
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Run full macOS 27 RC
        run: bash scripts/run-full-macos.sh

      - name: Archive and package IPA
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'Faraday' }}
          WANT_SIGNED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.signed == 'false' && 'false' || 'true' }}
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: bash scripts/package-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
