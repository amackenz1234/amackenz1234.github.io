<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Electro Cycles · Ontario</title>
  <meta name="nativ-sample" content="shop" />
  <meta name="theme-color" content="#0c0c0e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root { --red:#c1121f; --ink:#0c0c0e; --panel:#16161a; --line:#2a2a30; --paper:#f4f1ea; --muted:#b7b2a8; --safe:env(safe-area-inset-bottom,12px); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--ink); color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding-bottom:76px; }
    a { color:inherit; }
    img { max-width:100%; display:block; }
    .wrap { width:min(1120px,calc(100% - 28px)); margin:0 auto; }
    header { position:sticky; top:0; z-index:20; background:rgba(12,12,14,.94); border-bottom:1px solid var(--line); }
    .nav { display:flex; align-items:center; justify-content:space-between; min-height:60px; }
    .brand { font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.78rem; text-decoration:none; }
    .brand span { color:#e5383b; }
    .hero { padding:40px 0 28px; }
    h1 { font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; max-width:12ch; }
    .lede { color:var(--muted); margin:14px 0 22px; max-width:40ch; }
    .btn { display:inline-block; background:var(--red); color:#fff; text-decoration:none; font-weight:800; border:0; border-radius:12px; padding:12px 16px; cursor:pointer; }
    .ghost { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-decoration:none; font-weight:700; background:transparent; color:var(--paper); cursor:pointer; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .chip { background:#1c1c22; border:1px solid var(--line); color:var(--paper); border-radius:999px; padding:8px 12px; cursor:pointer; }
    .chip.on { background:var(--red); border-color:var(--red); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer; }
    .pic { aspect-ratio:4/3; background:#09090b; }
    .pic img { width:100%; height:100%; object-fit:cover; }
    .body { padding:12px 14px 16px; }
    .tag { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .price { font-weight:800; margin-top:6px; }
    .out { color:#e5383b; font-size:.8rem; }
    .section { padding:28px 0; }
    footer { border-top:1px solid var(--line); padding:24px 0 calc(20px + var(--safe)); color:var(--muted); font-size:.85rem; }
    .dock { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 12px calc(10px + var(--safe)); background:#111; border-top:1px solid var(--line); }
    .dock a { flex:1; text-align:center; text-decoration:none; font-weight:800; line-height:44px; border-radius:12px; }
    .dock .shop { background:var(--red); color:#fff; }
    .dock .call { background:#2a2a2a; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; overflow:auto; padding:20px 12px 90px; }
    .sheet { background:var(--panel); border:1px solid var(--line); border-radius:20px; max-width:640px; margin:20px auto; overflow:hidden; }
    .sheet img { width:100%; max-height:320px; object-fit:cover; }
    .sheet .pad { padding:16px; }
    input.search { width:100%; margin:0 0 16px; padding:12px 14px; border-radius:12px; border:1px solid #2a2a30; background:#16161a; color:#f4f1ea; }
    @media (min-width:900px) { body { padding-bottom:0; } .dock { display:none; } }
  </style>
</head>
<body>
  <p style="margin:0;padding:10px 16px;background:#111;border-bottom:1px solid #2a2a30;font:600 13px/1.4 -apple-system,sans-serif"><a href="../" style="color:#f4f1ea">← Nativ</a> · Sample shop</p>

  <script src="./products.js"></script>
  <div id="root"></div>
  <script src="./ui.js"></script>
  <script src="./payments-config.js"></script>
  <script src="./payments.js"></script>
</body>
</html>
